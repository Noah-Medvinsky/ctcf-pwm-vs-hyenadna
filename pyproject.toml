[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ctcf"
version = "0.1.0"
description = "PWM vs. HyenaDNA for CTCF binding-site prediction (reproduction of Tang et al. 2025, Task 2)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
